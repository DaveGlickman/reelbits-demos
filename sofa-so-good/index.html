<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="./demo-rgs.js"></script>
<title>Sofa So Good</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Lilita'; src: url('./lilita-one-latin-400-normal.woff2') format('woff2'); font-display: block; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2A1E1A; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
#rules { position: fixed; inset: 4vh 4vw; display: none; z-index: 5; font-family: 'Lilita', sans-serif; color: #2A1E1A;
  border: 34px solid transparent; border-image: url('./plate.webp') 60 fill / 34px stretch; }
#rules .in { position: absolute; inset: 0 0 58px 0; overflow-y: auto; padding: 6px 10px 8px; font-size: clamp(14px, 2.1vh, 19px); line-height: 1.35; letter-spacing: 0.01em; }
#rules h2 { margin: 0 0 8px; text-align: center; color: #A87A1C; font-size: 1.5em; font-weight: 400; }
#rules h3 { margin: 14px 0 4px; color: #A87A1C; font-weight: 400; font-size: 1.15em; }
#rules p { margin: 0 0 6px; } #rules b { color: #C8483A; font-weight: 400; }
#rules table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; } #rules td, #rules th { border-bottom: 2px solid #D9A62E; padding: 4px 6px; text-align: left; font-weight: 400; }
#rules th { color: #A87A1C; }
#rules table.stats { table-layout: auto; } #rules table.stats td:not(:first-child), #rules table.stats th:not(:first-child) { white-space: nowrap; }
@media (max-width: 480px) {
  #rules { inset: 3vh 2.5vw; border-width: 20px; border-image: url('./plate.webp') 60 fill / 20px stretch; }
  #rules .in { padding: 4px 4px 6px; }
  #rules td, #rules th { padding: 4px 3px; font-size: max(14px, 0.86em); }
}
#rules .close { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font: inherit; font-size: 20px; color: #FFF2D9; background: #C8483A;
  border: 3px solid #2A1E1A; border-radius: 22px; padding: 8px 26px; min-width: 120px; min-height: 44px; -webkit-text-stroke: 1px #2A1E1A; }
@media (max-height: 300px) {
  #rules { inset: 2vh 2vw; border-width: 14px; border-image: url('./plate.webp') 60 fill / 14px stretch; }
  #rules .in { font-size: 12px; inset: 0 0 38px 0; padding: 2px 6px 4px; }
  #rules .close { font-size: 14px; min-height: 32px; min-width: 90px; padding: 4px 14px; bottom: 4px; border-width: 2px; }
}
</style></head>
<body><canvas id="c"></canvas><div id="rules"><div class="in"></div><button class="close">CLOSE</button></div><script type="module" src="./main.js"></script></body></html>
