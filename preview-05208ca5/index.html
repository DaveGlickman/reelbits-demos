<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reelbit | Private preview</title>
<link rel="icon" href="../favicon.png">
<style>
@font-face{font-family:Cinzel;font-weight:900;src:url(../fonts/cinzel-900.woff2) format('woff2');font-display:swap}
:root{--bg:#07080f;--panel:#10131f;--line:#262b40;--gold:#f2c14e;--gold2:#c8902a;--text:#eef0f7;--muted:#9aa1b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,rgba(7,8,15,.55),rgba(7,8,15,.92)),url(play/assets/key_art-qwTyaQg3.webp) center/cover no-repeat,var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:400px;background:rgba(16,19,31,.92);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;backdrop-filter:blur(6px)}
.mark{font-family:Cinzel,serif;font-weight:900;font-size:20px;letter-spacing:.08em;background:linear-gradient(180deg,#ffe9a8,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:Cinzel,serif;font-weight:900;font-size:28px;margin:14px 0 4px}
p{color:var(--muted);font-size:14.5px}
form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0e18;color:var(--text);text-align:center}
input:focus{outline:2px solid var(--gold2);border-color:transparent}
button{font-family:Cinzel,serif;font-weight:900;letter-spacing:.06em;font-size:16px;padding:12px;border:0;border-radius:999px;color:#1b1203;cursor:pointer;background:linear-gradient(180deg,#ffe08a,var(--gold) 50%,var(--gold2))}
.err{color:#ff7a6b;font-size:14px;min-height:20px}
.foot{margin-top:16px;font-size:12.5px}
</style>
</head>
<body>
<main class="box">
  <div class="mark">REELBIT</div>
  <h1>The Big Smelt</h1>
  <p>Private preview. Enter the password you were given.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
    <button type="submit">Play demo</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="foot">Play-money demo. No real money is used.</p>
</main>
<script>
var SALT='c286f4bb3eae4f7c8a4a8a064b7dd802', HASH='efcf8a0bb823207cd8fbb7c16ecb3bfec3bc706bf25b5544321fa95c761ea87d', KEY='rb_bigsmelt';
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function unhex(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))}
function remembered(){try{return localStorage.getItem(KEY)===HASH}catch(e){return false}}
if(remembered()) location.replace('play/');
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault(); var err=document.getElementById('err'); err.textContent='';
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(SALT),iterations:150000},k,256);
  if(hex(bits)===HASH){try{localStorage.setItem(KEY,HASH)}catch(x){} try{sessionStorage.setItem(KEY,HASH)}catch(x){} location.href='play/';}
  else err.textContent='That password is not right.';
});
</script>
</body>
</html>
