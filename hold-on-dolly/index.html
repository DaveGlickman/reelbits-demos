<body>
<div id="stage"></div>
<div id="splash"><img id="logo" src="./ui/logo.webp" alt="Hold On, Dolly!"><div id="loadbar"><i></i></div><button id="start" class="hide">TAP TO START</button></div>
<div id="hud">
  <div id="sign"><span class="lab" id="t_haul">HAUL</span><span id="haul">0.00X</span><span id="mult">x1</span><span id="proj"></span></div>
  <div id="meter"><img src="./art/golddyn.webp" alt=""><img src="./art/golddyn.webp" alt=""><img src="./art/golddyn.webp" alt=""><span id="t_meter">NIGHT SHIFT</span></div>
  <div id="powers"></div>
  <div id="kinds">
    <button data-m="ORE_CART" class="sl"><b></b><small></small></button>
    <button data-m="EXPRESS" class="sl on"><b></b><small></small></button>
    <button data-m="DYNAMITE_RUN" class="sl"><b></b><small></small></button>
  </div>
  <div id="corner">
    <button id="menu" class="ico"><img src="./ui/ui_menu.webp" alt=""><span id="t_menu">MENU</span></button>
    <button id="snd" class="ico"><img id="sndi" src="./ui/ui_sound.webp" alt=""><span id="t_sound">SOUND</span></button>
  </div>
  <div id="fork" class="hide">
    <button id="up" class="fk"><i>&#8599;</i><b id="t_upper">HIGH LINE</b><span class="pv" id="pv0"></span></button>
    <span id="forkq">PICK A TRACK</span>
    <button id="down" class="fk"><i>&#8600;</i><b id="t_lower">LOW LINE</b><span class="pv" id="pv1"></span></button>
  </div>
  <div id="bar">
    <div class="grp left">
      <div class="val balv"><span class="lab" id="t_balance">BALANCE</span><span id="bal">—</span></div>
      <div class="val bet">
        <span class="lab" id="t_bet">BET</span>
        <div class="betrow"><button id="minus" class="rb" aria-label="lower"><img src="./ui/ui_minus.webp" alt=""></button><span id="bet">—</span><button id="plus" class="rb" aria-label="raise"><img src="./ui/ui_plus.webp" alt=""></button></div>
      </div>
      <button id="buy" class="ico"><img src="./ui/ui_bonus.webp" alt=""><span id="t_bonus">BUY BONUS</span></button>
    </div>
    <div class="val win"><span class="lab" id="t_win">WIN</span><span id="win">0.00</span></div>
    <div class="grp right">
      <button id="turbo" class="ico"><img src="./ui/ui_turbo.webp" alt=""><span id="t_turbo">TURBO</span></button>
      <button id="play" aria-label="play"><img class="up" src="./ui/ui_play.webp" alt=""><img class="down" src="./ui/ui_play_down.webp" alt=""><span id="t_play">PLAY</span></button>
      <button id="auto" class="ico"><img src="./ui/ui_auto.webp" alt=""><span id="t_auto">AUTO</span></button>
    </div>
  </div>
  <div id="replaytag"></div>
  <button id="again" class="hide">PLAY AGAIN</button>
</div>
<div id="pop" class="hide">
  <div class="panel">
    <button class="x" id="popx" aria-label="close"><img src="./ui/ui_close.webp" alt=""></button>
    <h2 id="poph"></h2>
    <div id="popb"></div>
  </div>
</div>
</body>
</html>
