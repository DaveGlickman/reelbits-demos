<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0820" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rattlesnake Roll</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' rx='18' fill='%230d0820' stroke='%23ff3fa4' stroke-width='6'/%3E%3Ccircle cx='35' cy='35' r='10' fill='%23ffc94a'/%3E%3Ccircle cx='65' cy='65' r='10' fill='%23ffc94a'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-CxrgDd1w.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BLOUdXzZ.css">
</head>
<body>
  <div id="app" class="app" data-mode="quick">
    <header class="top">
      <button class="iconbtn" id="menuBtn"><span class="burger"></span></button>
      <div class="logo" id="logo"></div>
      <div class="topright"><div class="session" id="session"></div><button class="iconbtn" id="soundBtn"></button></div>
    </header>

    <div class="cols">
      <div class="col left">
        <section class="meters" id="meters">
          <button class="meter coin" id="coinBtn"><span class="label" id="balLabel"></span><span class="value" id="balance"></span><span class="swap" id="coinSwap"></span></button>
          <div class="meter"><span class="label" id="inPlayLabel"></span><span class="value" id="inPlay"></span></div>
          <div class="meter"><span class="label" id="lastLabel"></span><span class="value" id="lastWin"></span></div>
        </section>

        <section class="stage" id="stage">
          <div class="backboard" id="backboard"></div>
          <div class="puck off" id="puck"></div>
          <button class="modebtn" id="modeBtn"></button>
          <div class="ridemeter hidden" id="rideMeter"></div>
          <div class="tray" id="tray"></div>
          <div class="strikebanner hidden" id="strikeBanner"></div>
          <div class="resultline" id="resultLine"></div>
          <div class="histstrip" id="histStrip"></div>
        </section>

        <div class="prompt" id="prompt" aria-live="polite"></div>
        <section class="rollmap" id="rollMap"></section>
      </div>

      <main class="felt" id="felt"></main>

      <footer class="controls" id="controls">
        <div class="rack" id="rack"></div>
        <div class="actions">
          <button class="pill" id="doubleBtn"></button>
          <button class="pill" id="rebetBtn"></button>
          <button class="roll" id="rollBtn"></button>
          <button class="pill" id="rebetRollBtn"></button>
          <button class="pill" id="autoBtn"></button>
          <button class="pill" id="layoutsBtn"></button>
        </div>
      </footer>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <div class="big hidden" id="big"><div class="bigtitle"></div><div class="bigsub"></div><div class="bighint"></div></div>
    <div class="striker-layer" id="strikerLayer" aria-hidden="true"></div>
    <div class="coach hidden" id="coach" role="dialog"><div class="coachcard"><div class="coachtext"></div><div class="coachbtns"></div></div></div>
    <div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet"><button class="close" id="modalClose">✕</button><div class="content"></div></div></div>
  </div>
</body>
</html>
