<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<script src="./demo-rgs.js"></script>
<title>Pip Pip Hooray!</title>
<link rel="preload" href="fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Fredoka'; src: url('fonts/fredoka-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: block; }
html, body { margin: 0; height: 100%; background: #23234a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
body { font-family: 'Fredoka', sans-serif; font-weight: 700; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center; line-height: 1; color: #3b2230; pointer-events: none; }
.lbl small { display: block; font-size: 0.46em; letter-spacing: 0.08em; color: #6b4232; margin-bottom: 0.12em; }
.lbl.light { color: #fff4dc; }
.lbl.light small { color: #ffe2a8; }
.pop { position: absolute; transform: translate(-50%, -50%); font-size: 30px; color: #fff4dc; pointer-events: none; white-space: nowrap;
  paint-order: stroke fill; -webkit-text-stroke: 7px #3b2230; }
.call { position: absolute; transform: translate(-50%, -50%); color: #ffd257; pointer-events: none; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke: 10px #3b2230; }
.lbl.sign { color: #3b2230; font-size: 26px; }
.lbl.cargo { color: #c9384a; paint-order: stroke fill; -webkit-text-stroke: 5px #fff4dc; }
.wind { position: absolute; text-align: center; color: #fff4dc; background: #9a5d36; border: 3px solid #3b2230; border-radius: 999px; cursor: pointer; pointer-events: auto; white-space: nowrap; box-sizing: border-box; }
.wind.sel { background: #e2483b; color: #fff4dc; transform: scale(1.08); }
#panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; background: rgba(20, 16, 40, 0.55); z-index: 10; }
#panel.on { display: flex; }
#panel .board { border: clamp(22px, 4.5vmin, 44px) solid transparent; border-image: url(ui/board.png) 65 fill / clamp(22px, 4.5vmin, 44px) stretch; padding: 0.4em 0.6em; max-width: min(92vw, 600px); max-height: 90vh; display: flex; flex-direction: column; box-sizing: border-box; }
#panel .board.wide { max-width: min(94vw, 760px); }
#panel .board > * { background: transparent; color: #3b2230; margin: 0; padding: 0.35em 0.6em; }
#panel .board > :first-child { border-radius: 14px 14px 0 0; }
#panel .board > :last-child { border-radius: 0 0 14px 14px; }
#panel h2 { font-size: clamp(20px, 3.4vh, 34px); text-align: center; color: #c9384a; letter-spacing: 0.04em; }
#panel h3 { font-size: clamp(15px, 2.3vh, 22px); margin: 0.8em 0 0.2em; color: #6b4232; }
#panel p, #panel td, #panel th, #panel small { font-size: clamp(13px, 2vh, 19px); line-height: 1.3; font-weight: 700; }
#panel .scroll { overflow-y: auto; max-height: 64vh; }
#panel .row { display: flex; gap: 0.6em; justify-content: center; flex-wrap: wrap; padding: 0.6em; }
#panel .btn { font: inherit; font-size: clamp(16px, 2.6vh, 26px); color: #fff4dc; background: #e2483b; border: 3px solid #3b2230; border-radius: 999px; padding: 0.25em 1.1em; cursor: pointer; }
#panel .btn.alt { background: #9a5d36; }
#panel .btn:active { transform: scale(0.94); }
#panel table.stats { border-collapse: collapse; width: 100%; }
#panel table.stats td, #panel table.stats th { border-bottom: 2px solid #e0ad6c; padding: 0.25em 0.4em; text-align: left; }
#panel .buyrow { display: flex; align-items: center; justify-content: space-between; gap: 1em; border-bottom: 3px solid #e0ad6c; }
#splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: rgba(28, 22, 54, 0.45); cursor: pointer; pointer-events: auto; }
#splash .logo { font-size: clamp(34px, 11vmin, 150px); line-height: 0.95; text-align: center; paint-order: stroke fill; -webkit-text-stroke: 0.14em #3b2230; letter-spacing: 0.02em; transform: rotate(-4deg); }
#splash .logo span { display: inline-block; }
#splash .tap { margin-top: 0.8em; font-size: clamp(18px, 4.5vmin, 46px); color: #fff4dc; paint-order: stroke fill; -webkit-text-stroke: 0.18em #3b2230; animation: tap 1.1s ease-in-out infinite; }
@keyframes tap { 50% { transform: scale(1.12); } }
#replaytag { position: fixed; left: 1vmin; top: 1vmin; z-index: 9; display: none; background: #c98d4e; border: 3px solid #3b2230; border-radius: 12px; padding: 4px; }
#replaytag div { background: #f6e7c6; color: #3b2230; border-radius: 8px; padding: 0.25em 0.6em; font-size: clamp(10px, 1.8vmin, 17px); line-height: 1.25; }
@media (max-height: 320px) { #panel .board { max-height: 98vh; } #panel .board > * { padding: 0.2em 0.6em; } #panel h2 { font-size: 15px; } #panel p, #panel td, #panel th, #panel small { font-size: 10px; } #panel .btn { font-size: 12px; padding: 0.15em 0.8em; } #panel .scroll { max-height: 60vh; } #panel .row { padding: 0.25em; } }
.hit { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 30%; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module" src="main.js"></script>
</body>
</html>
