  <link rel="modulepreload" crossorigin href="./assets/Filter-D64Ooj7C.js">
  <link rel="modulepreload" crossorigin href="./assets/canvasUtils-JN24rb-9.js">
  <link rel="modulepreload" crossorigin href="./assets/Cache-Fe5FZMXW.js">
  <link rel="modulepreload" crossorigin href="./assets/defaultFilter.vert-DTN87-gZ.js">
  <link rel="modulepreload" crossorigin href="./assets/GCManagedHash-Bdk3V0fg.js">
  <link rel="modulepreload" crossorigin href="./assets/BatchableSprite-D9T8nDyR.js">
  <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-CNzFOFmn.js">

<body>
<div id="stage"></div>
<div id="splash"><img id="logo" src="./ui/logo.webp" alt="Junk Jumbo"><div id="loadbar"><i></i></div><button id="start" class="hide">TAP TO START</button></div>
<div id="hud">
  <div id="magnets">
    <button data-m="SMALL_MAGNET" class="mg on"><b></b><small></small></button>
    <button data-m="BIG_MAGNET" class="mg"><b></b><small></small></button>
  </div>
  <div id="hint"></div>
  <div id="corner">
    <button id="menu" class="ico"><img src="./ui/ui_menu.webp" alt=""><span id="t_menu">MENU</span></button>
    <button id="snd" class="ico"><img src="./ui/ui_sound.webp" alt=""><span id="t_sound">SOUND</span></button>
  </div>
  <div id="bar">
    <div class="grp left">
      <div class="val balv"><span class="lab" id="t_balance">BALANCE</span><span id="bal">—</span></div>
      <div class="val bet">
        <span class="lab" id="t_bet">BET</span>
        <div class="betrow"><button id="minus" class="rb" aria-label="lower"><img src="./ui/ui_minus.webp" alt=""></button><span id="bet">—</span><button id="plus" class="rb" aria-label="raise"><img src="./ui/ui_plus.webp" alt=""></button></div>
      </div>
      <button id="buy" class="ico"><img src="./ui/ui_bonus.webp" alt=""><span id="t_bonus">BUY BONUS</span></button>
    </div>
    <div id="sign" class="win"><span class="lab" id="t_win">WIN</span><span id="win">0.00</span></div>
    <div class="grp right">
      <button id="turbo" class="ico"><img src="./ui/ui_turbo.webp" alt=""><span id="t_turbo">TURBO</span></button>
      <button id="play" aria-label="play"><img class="up" src="./ui/ui_play.webp" alt=""><img class="down" src="./ui/ui_play_down.webp" alt=""><span id="t_play">PLAY</span></button>
      <button id="auto" class="ico"><img src="./ui/ui_auto.webp" alt=""><span id="t_auto">AUTO</span></button>
    </div>
  </div>
  <div id="replaytag"></div>
  <button id="again" class="hide">PLAY AGAIN</button>
</div>
<div id="pop" class="hide">
  <div class="panel">
    <button class="x" id="popx" aria-label="close"><img src="./ui/ui_close.webp" alt=""></button>
    <h2 id="poph"></h2>
    <div id="popb"></div>
  </div>
</div>
</body>
</html>
