<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<script src="./demo-rgs.js"></script>
<title>Sink &amp; Drink</title>
  <script type="module" crossorigin src="./assets/index-DrbU8Eku.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bxu4w6Oi.css">
</head>
<body>
<div id="stage"><canvas id="scene"></canvas></div>
<div id="splash"><div id="logo">SINK &amp;<br><span>DRINK!</span></div><div id="loadbar"><i></i></div><button id="start" class="hide">TAP TO START</button></div>
<div id="hud">
  <div id="sign"><span class="lab" id="t_total">TRICK</span><span id="total">0x</span><span id="mults"></span></div>
  <div id="kinds">
    <button data-m="QUICK_SIP" class="sl"><b></b><small></small></button>
    <button data-m="HOUSE_ALE" class="sl on"><b></b><small></small></button>
    <button data-m="DRAGON_STOUT" class="sl"><b></b><small></small></button>
  </div>
  <div id="corner">
    <button id="menu" class="ico"><img src="./ui/ui_menu.webp" alt=""><span id="t_menu">MENU</span></button>
    <button id="snd" class="ico"><img id="sndi" src="./ui/ui_sound.webp" alt=""><span id="t_sound">SOUND</span></button>
  </div>
  <div id="throwtitle" class="hide"><span id="t_pick">PICK YOUR THROW</span></div>
  <div id="throws" class="hide"><button id="thr0"><b>FLICK</b><small></small></button><button id="thr1"><b>LOB</b><small></small></button><button id="thr2"><b>BANK</b><small></small></button></div>
  <div id="bar">
    <div class="grp left">
      <div class="val balv"><span class="lab" id="t_balance">BALANCE</span><span id="bal">—</span></div>
      <div class="val bet">
        <span class="lab" id="t_bet">BET</span>
        <div class="betrow"><button id="minus" class="rb" aria-label="lower"><img src="./ui/ui_minus.webp" alt=""></button><span id="bet">—</span><button id="plus" class="rb" aria-label="raise"><img src="./ui/ui_plus.webp" alt=""></button></div>
      </div>
      <button id="buy" class="ico"><img src="./ui/ui_bonus.webp" alt=""><span id="t_bonus">BUY BONUS</span></button>
    </div>
    <div class="val win"><span class="lab" id="t_win">WIN</span><span id="win">0.00</span></div>
    <div class="grp right">
      <button id="turbo" class="ico"><img src="./ui/ui_turbo.webp" alt=""><span id="t_turbo">TURBO</span></button>
      <button id="play" aria-label="play"><img class="up" src="./ui/ui_play.webp" alt=""></button>
      <button id="auto" class="ico"><img src="./ui/ui_auto.webp" alt=""><span id="t_auto">AUTO</span></button>
    </div>
  </div>
  <div id="banner" class="hide"><b id="bt"></b><small id="bs"></small></div>
  <div id="replaytag"></div>
  <button id="again" class="hide">PLAY AGAIN</button>
</div>
<div id="pop" class="hide">
  <div class="panel">
    <button class="x" id="popx" aria-label="close"><img src="./ui/ui_close.webp" alt=""></button>
    <h2 id="poph"></h2>
    <div id="popb"></div>
  </div>
</div>
</body>
</html>
